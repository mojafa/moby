name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs without interrupting push, tag, scheduled, or
  # manually dispatched validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'homer-bench'

env:
  DESTDIR: ./build
  SETUP_BUILDX_VERSION: edge
  SETUP_BUILDKIT_IMAGE: moby/buildkit:latest

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20 # guardrails timeout for the whole job
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, homer-bench]
            target: binary
          - runner: [self-hosted, homer-bench]
            target: dynbinary
    steps:
      -
        name: Use persistent Buildx builder
        run: |
          docker buildx inspect homer-warm >/dev/null 2>&1 || docker buildx create --name homer-warm --driver docker-container --driver-opt image=${{ env.SETUP_BUILDKIT_IMAGE }} --buildkitd-flags '--debug'
          docker buildx inspect --bootstrap homer-warm >/dev/null
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          builder: homer-warm
          targets: ${{ matrix.target }}
      -
        name: List artifacts
        run: |
          tree -nh ${{ env.DESTDIR }}
      -
        name: Check artifacts
        run: |
          find ${{ env.DESTDIR }} -type f -exec file -e ascii -- {} +

  prepare-cross:
    runs-on: [self-hosted, homer-bench]
    timeout-minutes: 20 # guardrails timeout for the whole job
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    outputs:
      includes: ${{ steps.gen.outputs.matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Create matrix
        id: gen
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          target: binary-cross
          fields: platforms

  cross:
    runs-on: [self-hosted, homer-bench]
    timeout-minutes: 20 # guardrails timeout for the whole job
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    needs:
      - prepare-cross
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-cross.outputs.includes) }}
    steps:
      -
        name: Prepare
        env:
          PLATFORM: ${{ matrix.platforms }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV
      -
        name: Use persistent Buildx builder
        run: |
          docker buildx inspect homer-warm >/dev/null 2>&1 || docker buildx create --name homer-warm --driver docker-container --driver-opt image=${{ env.SETUP_BUILDKIT_IMAGE }} --buildkitd-flags '--debug'
          docker buildx inspect --bootstrap homer-warm >/dev/null
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          builder: homer-warm
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platforms }}
      -
        name: List artifacts
        run: |
          tree -nh ${{ env.DESTDIR }}
      -
        name: Check artifacts
        run: |
          find ${{ env.DESTDIR }} -type f -exec file -e ascii -- {} +

  govulncheck:
    runs-on: [self-hosted, homer-bench]
    timeout-minutes: 120 # guardrails timeout for the whole job
    # Always run security checks, even with 'ci/validate-only' label
    permissions:
      contents: read # same as global permission
      security-events: write # required to write sarif report
    steps:
      -
        name: Use persistent Buildx builder
        run: |
          docker buildx inspect homer-warm >/dev/null 2>&1 || docker buildx create --name homer-warm --driver docker-container --driver-opt image=${{ env.SETUP_BUILDKIT_IMAGE }} --buildkitd-flags '--debug'
          docker buildx inspect --bootstrap homer-warm >/dev/null
      -
        name: Run
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          builder: homer-warm
          targets: govulncheck
        env:
          GOVULNCHECK_FORMAT: sarif
      -
        name: Upload SARIF report
        if: ${{ github.event_name != 'pull_request' && github.repository == 'moby/moby' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.DESTDIR }}/govulncheck.out

  build-dind:
    runs-on: [self-hosted, homer-bench]
    timeout-minutes: 120 # guardrails timeout for the whole job
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    steps:
      -
        name: Use persistent Buildx builder
        run: |
          docker buildx inspect homer-warm >/dev/null 2>&1 || docker buildx create --name homer-warm --driver docker-container --driver-opt image=${{ env.SETUP_BUILDKIT_IMAGE }} --buildkitd-flags '--debug'
          docker buildx inspect --bootstrap homer-warm >/dev/null
      -
        name: Build dind image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          builder: homer-warm
          targets: dind
          set: |
            *.output=type=cacheonly

  success:
    name: CI Build Success
    runs-on: [self-hosted, homer-bench]
    if: ${{ always() }}
    needs:
      - build
      - prepare-cross
      - cross
      - govulncheck
      - build-dind
    steps:
      -
        name: Check CI result
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      -
        name: Report success
        run: echo "All CI jobs completed successfully"

  # Compatibility for the previous required check name.
  # TODO(vvoland): Remove once most PRs have rebased
  build-binary:
    name: build (binary)
    runs-on: [self-hosted, homer-bench]
    if: ${{ always() }}
    needs:
      - success
    steps:
      -
        name: Check CI result
        if: ${{ needs.success.result != 'success' }}
        run: exit 1
      -
        name: Report success
        run: echo "CI build completed successfully"
